# Sanitized structural mirror of the-array/litellm_config.yaml (2026-10-02). Comments and identity values
# removed or replaced; budgets are placeholders. See mirror/README.md before restoring from it.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  otel_exporter: none
  always_include_stream_usage: true
  ui_access_mode: admin_only
  default_team_disabled: true
  pass_through_endpoints:
    - path: /typesafe
      target: https://api.typesafe.ai
      include_subpath: true
      auth: true
      headers:
        Authorization: Bearer os.environ/TYPESAFE_API_KEY
        content-type: application/json
      cost_per_request: 2.0e-05
      timeout: 30
litellm_settings:
  success_callback:
    - prometheus
    - otel
  failure_callback:
    - prometheus
    - otel
  callbacks:
    - refusal_fallback.proxy_handler_instance
    - jev_gate.judge_instance
    - unsloth_guard.guard_instance
  service_callback:
    - prometheus_system
  turn_off_message_logging: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  set_verbose: false
  drop_params: true
  max_budget: 1.0
  budget_duration: 1mo
  num_retries: 3
  request_timeout: 180
  telemetry: false
  require_auth_for_metrics_endpoint: false
  context_window_fallbacks:
    - local-gemma4-12b:
        - local-qwen3.5-4b
    - local-lfm2.5-8b:
        - local-qwen3.5-4b
    - local-ministral-3b:
        - local-qwen3.5-4b
  content_policy_fallbacks:
