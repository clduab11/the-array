# Sanitized structural mirror of the-array/searxng_settings.yml (2026-09-23). Comments and identity values
# removed or replaced; budgets are placeholders. See mirror/README.md before restoring from it.
use_default_settings: true
general:
  instance_name: Praxen Search
  debug: false
  enable_metrics: true
search:
  safe_search: 0
  autocomplete: google
  default_lang: en
  formats:
    - html
    - json
server:
  secret_key: ${SEARXNG_SECRET}
  limiter: false
  image_proxy: true
  method: GET
valkey:
  url: redis://redis:6379/0
ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: dark
enabled_plugins:
  - Hash plugin
  - Self Information
  - Tracker URL remover
  - Open Access DOI rewrite
