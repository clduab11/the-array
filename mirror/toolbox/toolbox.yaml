# Sanitized structural mirror of the-array/toolbox/toolbox.yaml (2026-10-29). Comments and identity values
# removed or replaced; budgets are placeholders. See mirror/README.md before restoring from it.
version: 1
updated: 2026-10-08

profiles:
  build-code: Build and ship code
  rnd-researcher: Research for Labs and the Institute (papers, models, the web)
  biz-ops: Business operations (LLC, tax, legal, HR)
  plan-triage: Portfolio, tickets, spend
  desktop: Supervised Windows GUI automation (desktop chat app and Zed only)

clients:
  zed: {profiles: [build-code, rnd-researcher, plan-triage, desktop]}
  opencode: {profiles: [build-code, rnd-researcher, plan-triage]}
  coder: {profiles: [build-code, rnd-researcher, plan-triage]}   # 2026-10-08: the opencode set; Coder Desktop runs the same engine and is the main driver
  vscode: {profiles: [build-code]}
  codex: {profiles: [build-code, rnd-researcher, plan-triage]}
  claude-code: {profiles: [build-code, rnd-researcher, plan-triage, biz-ops]}
  front-studio: {profiles: [build-code, rnd-researcher, biz-ops, plan-triage, desktop]}
  front-go: {profiles: [biz-ops, plan-triage]}
  paperclip: {profiles: [build-code, rnd-researcher, plan-triage]}
  claude-code-wsl: {profiles: [build-code, rnd-researcher, plan-triage, biz-ops]}
  codex-wsl: {profiles: [build-code, rnd-researcher, plan-triage]}
  opencode-wsl: {profiles: [build-code, rnd-researcher, plan-triage]}
  grok: {profiles: [build-code, rnd-researcher, plan-triage]}
  hermes: {profiles: [build-code]}

runtimes:
  npx: C:/Program Files/nodejs/npx.cmd
  uvx: ~/.local/bin/uvx.exe
  mempalace_full: ~/.local/bin/mempalace-mcp.exe
  mempalace_light: ~/.local/bin/mempalace-light-mcp.exe
  node: C:/Program Files/nodejs/node.exe          # 2026-10-08: path-runner tools that start a JS file (the guarded Playwright launch)
  rvm_docs: C:/Praxen/Tools/rvm/rvm-docs-mcp.exe  # 2026-10-08: ruv stack, NOT installed yet; the rvm-docs tool is setup-gated
  graphify_mcp: ~/AppData/Roaming/uv/tools/graphifyy/Scripts/graphify-mcp.exe  # 2026-10-08: uv tool graphifyy[mcp]==0.9.80 (python -m graphify.serve)
  mcp_remote: mcp-remote@0.14.2   # where a client cannot send an env-sourced header natively; in Zed for EVERY hosted tool,

client_runtimes:
  claude-code-wsl: &wsl_runtimes
    npx: /usr/bin/npx
    uvx: /home/pc-host/.local/bin/uvx
    mempalace_full: /mnt/c/Users/pc-host/.local/bin/mempalace-mcp.exe
    mempalace_light: /mnt/c/Users/pc-host/.local/bin/mempalace-light-mcp.exe
  codex-wsl: *wsl_runtimes
  opencode-wsl: *wsl_runtimes
  grok: *wsl_runtimes
  paperclip: *wsl_runtimes

secrets:
  EXA_API_KEY: {status: present, for: exa}
  JINA_API_KEY: {status: present, for: jina}
  CONTEXT7_API_KEY: {status: present, for: context7}
  FIRECRAWL_API_KEY: {status: present, for: firecrawl}
  HF_TOKEN: {status: present, for: huggingface, note: use a read-only token}
  GITHUB_MCP_PAT: {status: present, for: github, note: "validated 2026-10-08 on /mcp/readonly (26 tools). OpenCode and Coder keep their own PATs clientside (OPENCODE_GITHUB_MCP_PAT, CODER_JSONC_GITHUB_PAT), which the toolbox cannot express"}
  TAVILY_API_KEY: {status: present, for: tavily, note: paid through 2026-10-30, then free tier (1,000 credits/month)}
  LINEAR_API_KEY: {status: optional, for: linear, note: "only for a header-only client; every rendered client signs in with OAuth instead"}
  PRAXEN_SPEND_RO_DSN: {status: present, for: dbhub, note: "set 2026-09-17: role spend_reader, SELECT on LiteLLM_SpendLogs only, default_transaction_read_only; toml at ~/.config/praxen-toolbox/dbhub.toml"}
  GO_MCP_TOKEN: {status: present, for: front-go, note: "lives only inside desktop chat app's Toolbox entry / Go's Settings > Tools; Studio-only tool, no other client reads it"}

tools:
  - id: searxng
    name: SearXNG
    tier: core
    profiles: [build-code, rnd-researcher, biz-ops, plan-triage]
    what: Web search through your own SearXNG (free); also reads a page and refuses local-network URLs
    transport: stdio
    runner: npx
    package: mcp-searxng@2.3.0
    env: {SEARXNG_URL: "http://localhost:8080"}
    note: Works only while the praxen Docker stack is up. Needs Node 22+ (this PC has 26).
    evidence: https://github.com/ihor-sokoliuk/mcp-searxng
  - id: exa
    name: Exa
    tier: core
    profiles: [build-code, rnd-researcher, biz-ops, plan-triage]
    what: AI web search and page fetch (2 tools on the hosted default)
    transport: http
    url: https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa
    auth: {type: header, header: x-api-key, secret: EXA_API_KEY}
    default_enabled: false
    note: >-
      Never put the key in the URL (?exaApiKey=). 2026-10-08: the hosted default now also registers agent_run (paid agentic search);
      the ?tools= filter keeps it to the two tools, as OpenCode and Coder already do. Policy 2026-10-03: research tier off by default,
      switched on to extend or verify what SearXNG found.
    evidence: https://exa.ai/docs/reference/exa-mcp
  - id: jina
    name: Jina
    tier: core
    profiles: [build-code, rnd-researcher, biz-ops, plan-triage]
    what: Answer-inside-a-page search, read a page with a question, arXiv and SSRN search
    transport: http
    url: https://mcp.jina.ai/v1?include_tools=search_web,read_url,search_arxiv,search_ssrn
    auth: {type: bearer, secret: JINA_API_KEY}
    default_enabled: false
    enabled_for: [coder]   # 2026-10-08 the operator: on in Coder
    note: >-
      The URL filter trims Jina's 12 tools to 4 on Jina's side. 2026-10-08: Jina MCP 1.9.0 renamed search_web_deep to search_web and
      folded parallel_read_url into read_url (arrays), so the old filter returned 3 tools. Front had the key written into the tool's
      arguments; this replaces that. Policy 2026-10-03: off by default.
    evidence: https://github.com/jina-ai/MCP
  - id: context7
    name: Context7
    tier: core
    profiles: [build-code, rnd-researcher, plan-triage]
    what: Current library and framework documentation (2 tools)
    transport: http
    url: https://mcp.context7.com/mcp
    auth: {type: bearer, secret: CONTEXT7_API_KEY}
    default_enabled: false
    note: >-
      Free plan stops at 1,000 calls a month. Treat returned snippets as untrusted text. Policy 2026-10-03: off by default
      (on in the live clients today; see the 10-08 ruling sheet).
    evidence: https://github.com/upstash/context7

  - id: microsoft-learn
    name: Microsoft Learn
    tier: role
    profiles: [build-code, biz-ops]
    what: Microsoft 365, Entra, Exchange, Graph, Azure and PowerShell docs; first call for Microsoft questions
    transport: http
    url: https://learn.microsoft.com/api/mcp
    auth: {type: none}
    evidence: https://github.com/MicrosoftDocs/mcp
  - id: deepwiki
    name: DeepWiki
    tier: role
    profiles: [build-code, rnd-researcher]
    what: Explains public GitHub repos; second call for library docs behind Context7
    transport: http
    url: https://mcp.deepwiki.com/mcp
    auth: {type: none}
    default_enabled: false
    note: >-
      Its index can lag the repo; check version-sensitive answers. Policy 2026-10-03: off by default (on in the live clients today).
    evidence: https://docs.devin.ai/work-with-devin/deepwiki-mcp
  - id: firecrawl
    name: Firecrawl
    tier: role
    profiles: [rnd-researcher]
    what: Crawl or map a whole site; second call to read one page
    transport: http
    url: https://mcp.firecrawl.dev/v2/mcp
    auth: {type: bearer, secret: FIRECRAWL_API_KEY}
    default_enabled: false
    enabled_for: [coder]   # 2026-10-08 the operator: on in Coder
    note: With a key it registers 28 tools (3.28.2) and crawls spend credits. Was on by default since the 2026-09-17 Zed set; off by default since 2026-10-08 (policy 2026-10-03), switch on per client for a crawl job.
    evidence: https://docs.firecrawl.dev/mcp-server
  - id: youtube-transcript
    name: YouTube transcripts
    tier: role
    profiles: [rnd-researcher]
    what: Pull a video's transcript into chat (no key)
    transport: stdio
    runner: uvx
    args: ["--from", "git+https://github.com/jkawamoto/mcp-youtube-transcript@v0.7.1", "mcp-youtube-transcript", "--response-limit", "15000"]
    note: Replaces the stale youtube-data-mcp-server. The PyPI copy is old, so it installs from the release tag (git is on PATH).
    evidence: https://github.com/jkawamoto/mcp-youtube-transcript
  - id: huggingface
    name: Hugging Face
    tier: core        # tracking tier (policy 2026-10-03): on everywhere
    profiles: [build-code, rnd-researcher, biz-ops, plan-triage]
    what: Models, datasets, papers and Spaces for the Unsloth and Kaggle work
    transport: http
    url: https://huggingface.co/mcp
    auth: {type: bearer, secret: HF_TOKEN}
    note: Choose tools at huggingface.co/settings/mcp (hf_fs only) and keep paid Jobs off.
    evidence: https://huggingface.co/docs/hub/hf-mcp-server
  - id: github
    name: GitHub
    tier: core        # tracking tier (policy 2026-10-03): on everywhere
    profiles: [build-code, rnd-researcher, biz-ops, plan-triage]
    what: Pull requests, issues and code search on GitHub, read-only with a trimmed tool list
    transport: http
    url: https://api.githubcopilot.com/mcp/readonly
    auth: {type: bearer, secret: GITHUB_MCP_PAT}
    headers: {X-MCP-Readonly: "true", X-MCP-Toolsets: "repos,issues,pull_requests,context"}
    note: >-
      The default load is ~52 tools / ~30k tokens; the toolsets header cuts it down (26 tools with context, verified 2026-10-08).
      /mcp/readonly makes read-only a property of the URL, not of a header a client might drop (OpenCode and Coder already use it).
      Add a separate write-enabled entry only for a task that needs one.
    evidence: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
  - id: chrome-devtools
    name: Chrome DevTools
    tier: role
    profiles: [build-code]
    what: The one browser tool — debug pages (console, network, performance) and light automation
    transport: stdio
    runner: npx
    package: chrome-devtools-mcp@1.9.0
    args: ["--isolated", "--no-usage-statistics", "--no-performance-crux"]
    disabled_for: [opencode]   # 2026-10-08 the operator: Coder runs Chrome DevTools beside the guarded Playwright
    note: >-
      Replaces Playwright in Zed. Add --slim (3 tools) for plain browsing. Never attach it to your signed-in Chrome profile.
      2026-10-08: rendered off for OpenCode and Coder, which run the receipt-checked Playwright launch below (both had this entry
      switched off behind a dead C:\Praxen\Tools path). the operator's call which one is the IDE browser tool.
    evidence: https://github.com/ChromeDevTools/chrome-devtools-mcp
  - id: playwright
    name: Playwright (guarded launch)
    tier: role
    profiles: [build-code]
    clients_only: [opencode, coder]
    what: Headless, isolated browser automation through the receipt-checked 0.0.80-r1 install under C:\Praxen\Tools (agentic-workbench release of 2026-09-08)
    transport: stdio
    runner: path
    command_runtime: node
    args: ['C:\Praxen\Tools\playwright\0.0.80-r1\playwright-mcp-launch-guard.mjs', '--contract', 'praxen-managed-tool-node-launch-guard-v1',
           '--root', 'C:\Praxen\Tools\playwright\0.0.80-r1', '--receipt', 'C:\Praxen\Tools\playwright\0.0.80-r1\install-receipt.json',
           '--receipt-sha256', '7b0d8b0cc4409c39a67d9b3a96158b4054411ad8a095939b3ad297793c407457',
           '--target', 'C:\Praxen\Tools\playwright\0.0.80-r1\node_modules\@playwright\mcp\cli.js', '--',
           '--headless', '--isolated', '--browser', 'chrome', '--executable-path', 'C:\Praxen\Tools\playwright\0.0.80-r1\browser\chrome.exe',
           '--block-service-workers', '--image-responses', 'omit', '--output-dir', 'C:\Praxen\Runtime\playwright-mcp-output']
    env: {NODE_EXTRA_CA_CERTS: "", NODE_OPTIONS: "", NODE_PATH: ""}
    note: >-
      Un-dropped 2026-10-08 for these two clients only: both run it today (connected in the 10-08 Coder probe; receipt SHA-256 re-verified).
      The launch guard checks the install receipt before starting the pinned cli.js; the paths keep the exact backslash form the receipt
      was written with. browser_evaluate stays available (the run-any-code concern behind the 09-17 drop).
    evidence: https://github.com/microsoft/playwright-mcp
  - id: markitdown
    name: Markitdown
    tier: role
    profiles: [biz-ops, rnd-researcher]
    what: Turns PDF, Word, Excel, PowerPoint and HTML into Markdown (1 tool)
    transport: stdio
    runner: uvx
    args: ["markitdown-mcp==0.0.1a7"]
    note: It can read any file your account can, so keep it out of unattended sessions that also browse the web.
    evidence: https://github.com/microsoft/markitdown/tree/main/packages/markitdown-mcp
  - id: linear
    name: Linear
    tier: core        # tracking tier (policy 2026-10-03): on everywhere; read-only endpoint, OAuth
    profiles: [build-code, rnd-researcher, biz-ops, plan-triage]
    what: Tickets and projects — read-only endpoint by default
    transport: http
    url: https://mcp.linear.app/mcp/readonly
    auth: {type: oauth}
    note: >-
      Linear's MCP is OAuth 2.1 with dynamic client registration; Claude Code (/mcp), Codex (codex mcp login), VS Code,
      Zed (via mcp-remote) and OpenCode all sign in interactively - no key needed. /mcp/readonly only ever exposes read
      tools. A Read-only API key (LINEAR_API_KEY) is optional, for a header-only client. The full https://mcp.linear.app/mcp
      (74 tools, can write) belongs in the one client where you file and triage issues.
    evidence: https://linear.app/docs/mcp
  - id: notion
    name: Notion
    tier: role
    profiles: [plan-triage]
    clients_only: [front-studio, claude-code]
    what: Look up and lightly edit Notion until the move to Obsidian is done
    transport: http
    url: https://mcp.notion.com/mcp
    auth: {type: oauth}
    note: Temporary. Delete Front's local @notionhq entry and revoke its integration token. Do the migration with Obsidian's Importer, not through MCP.
    evidence: https://developers.notion.com/guides/mcp/get-started-with-mcp
  - id: sentry
    name: Sentry
    tier: role
    profiles: [build-code, plan-triage]
    what: Errors and traces for apps that report to Sentry (inspect + seer skills only)
    transport: http
    url: https://mcp.sentry.dev/mcp/your-account/your-account
    auth: {type: oauth}
    note: Scoped to one org and project. Leave the triage and project-management skills off.
    evidence: https://github.com/getsentry/sentry-mcp
  - id: dbhub
    name: DBHub (spend ledger)
    tier: role
    profiles: [plan-triage, biz-ops]
    what: One read-only database tool for the LiteLLM spend ledger (and any local SQLite file later)
    transport: stdio
    runner: npx
    package: "@bytebase/dbhub@1.2.5"
    args: ["--transport", "stdio", "--config", "~/.config/praxen-toolbox/dbhub.toml"]
    secrets_env: [PRAXEN_SPEND_RO_DSN]
    note: Replaces the SQLite, MySQL, SQL Server and PostgreSQL entries. Read-only lives only in the TOML — a launch with just --dsn can write.
    evidence: https://github.com/bytebase/dbhub
  - id: filesystem
    name: Filesystem
    tier: role
    profiles: [biz-ops, build-code]
    clients_only: [front-studio, front-go]
    what: File access for chat apps that have no file tools of their own
    transport: stdio
    runner: npx
    package: "@modelcontextprotocol/server-filesystem@2026.8.31"
    args: ["~/Desktop/github-projects"]
    note: Coding apps already read and write files. Never list the-array's root (it holds .env) or praxen-vault/closed.
    evidence: https://github.com/modelcontextprotocol/servers/blob/main/src/filesystem/README.md
  - id: windows-mcp
    name: Windows-MCP
    tier: role
    profiles: [desktop]
    clients_only: [front-studio, zed, opencode, coder, codex]   # 2026-10-08: present in the IDE clients, off there (no desktop profile); Coder runs an unpinned copy ON today
    what: Drive Windows apps that have no API, supervised, in desktop chat app or Zed
    transport: stdio
    runner: uvx
    args: ["windows-mcp==0.8.5", "serve", "--exclude-tools", "PowerShell,Registry,FileSystem,Process"]
    env: {ANONYMIZED_TELEMETRY: "false"}
    note: Full user privileges and no undo, so UI tools only. Zed was added 2026-10-01 so the agent can drive the desktop. This server is not part of any product repository.
    evidence: https://github.com/CursorTouch/Windows-MCP

  - id: front-go
    name: task app (control plane)
    tier: role
    profiles: [plan-triage]
    clients_only: [front-studio]
    what: Drive task app from a Studio chat - create/stop agents, enqueue prompts, read conversations, answer approvals, connect channels (29 tools on Go 0.16.0)
    transport: http
    url: http://127.0.0.1:6274/mcp
    auth: {type: header, header: Authorization, secret: GO_MCP_TOKEN}
    note: >-
      Documented by the vendor as the task app's local MCP endpoint (docs.example.com/go/tools). Probed 2026-09-16: it wants the
      RAW token in the Authorization header - a "Bearer " prefix returns 401. It exposes Go's CONTROL PLANE (agents,
      channels, approvals, providers, sender groups), not Go's own file/shell tools. Because respond_pending_approval,
      configure_provider and the channel setup tools are on it, keep this tool in its OWN toolset (plan-triage) and never
      co-attached with web-reading tools (SearXNG, Exa, Jina, Firecrawl) - outside web content is the injection path the operator
      cares about. Token comes from Go > Settings > Tools > Built-in local MCP endpoint; it changes when Go rotates it.
    evidence: https://docs.example.com/go/tools

  - id: gitlab
    name: GitLab
    tier: role
    profiles: [build-code, plan-triage]
    what: Projects, issues and merge requests on gitlab.com through GitLab's own MCP server (beta, all tiers)
    transport: http
    url: https://gitlab.com/api/v4/mcp
    auth: {type: oauth}
    headers: {X-Gitlab-Mcp-Server-Tool-Name-Prefix: "gitlab_"}
    note: OAuth 2.0 dynamic client registration on first connect; no token to store. The prefix header keeps its tool names from colliding with GitHub's.
    evidence: https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/mcp_server/
  - id: pdf-tools
    name: PDF Tools
    tier: role
    profiles: [biz-ops]
    clients_only: [claude-code, front-studio, zed, opencode, coder]
    enabled_for: [claude-code, front-studio]   # 2026-10-08 policy host tier: present but off elsewhere (22 tools of schema)
    what: Create PDFs from Markdown, fill forms, merge, split, encrypt (the operator's Front entry, kept by ruling 2026-09-16)
    transport: stdio
    runner: npx
    package: "@aryanbv/pdf-toolkit-mcp@0.3.1"
    note: ~22 tools, so it stays in the two chat clients only (schema cost in clients that do not defer tools). Package last published 2026-05-29 - re-check before bumping. Markitdown covers READING PDFs everywhere.
    evidence: https://www.npmjs.com/package/@aryanbv/pdf-toolkit-mcp
  - id: desktop-commander
    name: Desktop Commander
    tier: role
    profiles: [build-code, biz-ops]
    clients_only: [claude-code, zed, opencode, coder, codex]
    enabled_for: [claude-code]   # 2026-10-08 policy 2026-10-03 host tier: present but off in the IDE clients (Coder runs it ON today, unpinned @latest)
    what: Terminal, process and file control from a chat client that has no shell of its own
    transport: stdio
    runner: npx
    package: "@wonderwhy-er/desktop-commander@0.2.50"
    args: ["--no-onboarding"]
    note: >-
      ONE client only (ruling 2026-09-16). Its config (~/.claude-server-commander/config.json) is shared by every app
      that runs it and it exposes set_config_value, so keep allowedDirectories narrow and never install it in the IDEs -
      they have terminals. Its folder limit does not apply to its terminal tool.
    evidence: https://github.com/wonderwhy-er/DesktopCommanderMCP
  - id: graphify
    name: graphify (code knowledge graph)
    tier: role
    profiles: [build-code]
    clients_only: [claude-code, opencode, codex, zed, coder]
    what: Query a per-repo knowledge graph (tree-sitter AST, no vector store; 10 tools incl. PR impact) instead of grepping; can also emit an Obsidian vault
    transport: stdio
    runner: path
    command_runtime: graphify_mcp
    args: ["graphify-out/graph.json"]
    note: >-
      Installed 2026-10-08 as the uv tool graphifyy[mcp]==0.9.80 (venv at %APPDATA%/uv/tools/graphifyy; the [mcp] extra is required).
      The default graph is graphify-out/graph.json relative to the client's working directory (Coder and OpenCode spawn local MCPs in
      the workspace dir); the server starts even when that file is missing, and every tool takes project_path for other repos.
      Build a graph with `graphify extract <repo> --code-only` (local AST, no LLM); `graphify cluster-only <repo>` names communities
      and DOES call an LLM: it auto-detects a backend from env keys and falls back to the `claude` CLI (Max plan) when none is set,
      so run it with `--backend openai` and OPENAI_BASE_URL pointed at LiteLLM, or skip it. Graphs built 2026-10-08: the-array,
      qrc-thresher, jev-test (graphify-out/ is gitignored in each). Coder skill + /graphify command installed globally
      (graphify install --platform coder).
    evidence: https://github.com/Graphify-Labs/graphify

  - id: memory
    name: Memory (knowledge graph)
    tier: role
    profiles: [build-code, rnd-researcher]
    clients_only: [opencode, coder, codex, claude-code]
    default_enabled: false
    what: Persistent entity/relation memory for chats driven by smaller models (the operator ruling 2026-09-17)
    transport: stdio
    runner: npx
    package: "@modelcontextprotocol/server-memory@2026.8.31"
    note: In Zed this is provided by the mcp-server-memory extension, so it is not rendered there. Off by default elsewhere; switch on for local-model sessions. Set MEMORY_FILE_PATH per client if the memories should not share one file.
    evidence: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  - id: sequential-thinking
    name: Sequential Thinking
    tier: role
    profiles: [build-code, rnd-researcher]
    clients_only: [opencode, coder, codex, claude-code]
    default_enabled: false
    what: Step-by-step scratchpad tool for models that do not plan well on their own (the operator ruling 2026-09-17)
    transport: stdio
    runner: npx
    package: "@modelcontextprotocol/server-sequential-thinking@2026.8.31"
    note: In Zed this is provided by the mcp-server-sequential-thinking extension, so it is not rendered there. Off by default; on for less capable local models, off for frontier models that already plan.
    evidence: https://github.com/modelcontextprotocol/servers/tree/main/src/sequentialthinking

  - id: figma
    name: Figma
    tier: role
    profiles: [build-code]
    clients_only: [opencode, coder]
    default_enabled: false
    what: Read designs and generate code from Figma files (Figma's remote server, OAuth)
    transport: http
    url: https://mcp.figma.com/mcp
    auth: {type: oauth}
    note: >-
      Both clients had it switched off. Needs a ruling: keep as an on-demand design tool, or drop (Claude Code reaches Figma
      through its own connector).
    evidence: https://developers.figma.com/docs/figma-mcp-server/
  - id: neon
    name: Neon
    tier: role
    profiles: [build-code, plan-triage]
    clients_only: [opencode, coder]
    default_enabled: false
    what: Neon Postgres projects, branches and SQL through Neon's remote MCP (OAuth)
    transport: http
