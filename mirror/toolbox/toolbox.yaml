# Sanitized structural mirror of the-array/toolbox/toolbox.yaml (2026-11-04). Comments and identity values
# removed or replaced; budgets are placeholders. See mirror/README.md before restoring from it.
version: 1
updated: 2026-10-08
profiles:
  build-code: Build and ship code
  rnd-researcher: Research for Labs and the Institute (papers, models, the web)
  biz-ops: Business operations (LLC, tax, legal, HR)
  plan-triage: Portfolio, tickets, spend
  desktop: Supervised Windows GUI automation (desktop chat app only)
clients:
  coder:
    profiles:
      - build-code
      - rnd-researcher
      - plan-triage
  vscode:
    profiles:
      - build-code
  codex:
    profiles:
      - build-code
      - rnd-researcher
      - plan-triage
  claude-code:
    profiles:
      - build-code
      - rnd-researcher
      - plan-triage
      - biz-ops
  front-studio:
    profiles:
      - build-code
      - rnd-researcher
      - biz-ops
      - plan-triage
      - desktop
  front-go:
    profiles:
      - biz-ops
      - plan-triage
  paperclip:
    profiles:
      - build-code
      - rnd-researcher
      - plan-triage
  claude-code-wsl:
    profiles:
      - build-code
      - rnd-researcher
      - plan-triage
      - biz-ops
  codex-wsl:
    profiles:
      - build-code
      - rnd-researcher
      - plan-triage
  grok:
    profiles:
      - build-code
      - rnd-researcher
      - plan-triage
runtimes:
  npx: C:/Program Files/nodejs/npx.cmd
  uvx: ~/.local/bin/uvx.exe
  mempalace_full: ~/.local/bin/mempalace-mcp.exe
  mempalace_light: ~/.local/bin/mempalace-light-mcp.exe
  node: C:/Program Files/nodejs/node.exe
  rvm_docs: C:/Praxen/Tools/rvm/rvm-docs-mcp.exe
  graphify_mcp: ~/AppData/Roaming/uv/tools/graphifyy/Scripts/graphify-mcp.exe
client_runtimes:
  claude-code-wsl: &id001
    npx: /usr/bin/npx
    uvx: /home/pc-host/.local/bin/uvx
    mempalace_full: /mnt/c/Users/pc-host/.local/bin/mempalace-mcp.exe
    mempalace_light: /mnt/c/Users/pc-host/.local/bin/mempalace-light-mcp.exe
  codex-wsl: *id001
  grok: *id001
  paperclip: *id001
secrets:
  JINA_API_KEY:
    for: jina
    status: unknown
  FIRECRAWL_API_KEY:
    for: firecrawl
    status: unknown
  HF_TOKEN:
    for: huggingface
    status: unknown
  GITHUB_MCP_PAT:
    for: github
    status: unknown
  TAVILY_API_KEY:
    for: tavily
    status: unknown
  LINEAR_API_KEY:
    for: linear
    status: unknown
  PRAXEN_SPEND_RO_DSN:
    for: dbhub
    status: unknown
  GO_MCP_TOKEN:
    for: front-go
    status: unknown
tools:
  - id: searxng
    name: SearXNG
    tier: core
    profiles:
      - build-code
      - rnd-researcher
      - biz-ops
      - plan-triage
    what: Web search through your own SearXNG (free); also reads a page and refuses local-network URLs
    transport: stdio
    runner: npx
    package: mcp-searxng@2.3.0
    env:
      SEARXNG_URL: http://localhost:8080
  - id: jina
    name: Jina
    tier: core
    profiles:
      - build-code
      - rnd-researcher
      - biz-ops
      - plan-triage
    what: Answer-inside-a-page search, read a page with a question, arXiv and SSRN search, semantic reranking and dedupe
    transport: http
    url: https://mcp.jina.ai/v1?include_tools=search_web,read_url,search_arxiv,search_ssrn,sort_by_relevance,deduplicate_strings
    auth:
      type: bearer
      secret: JINA_API_KEY
    default_enabled: false
    enabled_for:
      - coder
  - id: microsoft-learn
    name: Microsoft Learn
    tier: role
    profiles:
      - build-code
      - biz-ops
    what: Microsoft 365, Entra, Exchange, Graph, Azure and PowerShell docs; first call for Microsoft questions
    transport: http
    url: https://learn.microsoft.com/api/mcp
    auth:
      type: none
  - id: firecrawl
    name: Firecrawl
    tier: role
    profiles:
      - rnd-researcher
    what: Crawl or map a whole site; second call to read one page
    transport: http
    url: https://mcp.firecrawl.dev/v2/mcp
    auth:
      type: bearer
      secret: FIRECRAWL_API_KEY
    default_enabled: false
    enabled_for:
      - coder
  - id: youtube-transcript
    name: YouTube transcripts
    tier: role
    profiles:
      - rnd-researcher
    what: Pull a video's transcript into chat (no key)
    transport: stdio
    runner: uvx
    args:
      - --from
      - git+https://github.com/jkawamoto/mcp-youtube-transcript@v0.7.1
      - mcp-youtube-transcript
      - --response-limit
      - '15000'
  - id: huggingface
    name: Hugging Face
    tier: core
    profiles:
      - build-code
      - rnd-researcher
      - biz-ops
      - plan-triage
    what: Models, datasets, papers and Spaces for the Unsloth and Kaggle work
    transport: http
    url: https://huggingface.co/mcp
    auth:
      type: bearer
      secret: HF_TOKEN
  - id: github
    name: GitHub
    tier: core
    profiles:
      - build-code
      - rnd-researcher
      - biz-ops
      - plan-triage
    what: Pull requests, issues and code search on GitHub, read-only with a trimmed tool list
    transport: http
    url: https://api.githubcopilot.com/mcp/readonly
    auth:
      type: bearer
      secret: GITHUB_MCP_PAT
    headers:
      X-MCP-Readonly: 'true'
      X-MCP-Toolsets: repos,issues,pull_requests,context
  - id: chrome-devtools
    name: Chrome DevTools
    tier: role
    profiles:
      - build-code
    what: The one browser tool — debug pages (console, network, performance) and light automation
    transport: stdio
    runner: npx
    package: chrome-devtools-mcp@1.9.0
    args:
      - --isolated
      - --no-usage-statistics
      - --no-performance-crux
  - id: playwright
    name: Playwright (guarded launch)
    tier: role
    profiles:
      - build-code
    clients_only:
      - coder
    what: Headless, isolated browser automation through the receipt-checked 0.0.80-r1 install under C:\Praxen\Tools (agentic-workbench release of 2026-09-08)
    transport: stdio
    runner: path
    command_runtime: node
    args:
      - C:\Praxen\Tools\playwright\0.0.80-r1\playwright-mcp-launch-guard.mjs
      - --contract
      - praxen-managed-tool-node-launch-guard-v1
      - --root
      - C:\Praxen\Tools\playwright\0.0.80-r1
      - --receipt
      - C:\Praxen\Tools\playwright\0.0.80-r1\install-receipt.json
      - --receipt-sha256
      - 7b0d8b0cc4409c39a67d9b3a96158b4054411ad8a095939b3ad297793c407457
      - --target
      - C:\Praxen\Tools\playwright\0.0.80-r1\node_modules\@playwright\mcp\cli.js
      - --
      - --headless
      - --isolated
      - --browser
      - chrome
      - --executable-path
      - C:\Praxen\Tools\playwright\0.0.80-r1\browser\chrome.exe
      - --block-service-workers
      - --image-responses
      - omit
      - --output-dir
      - C:\Praxen\Runtime\playwright-mcp-output
    env:
      NODE_EXTRA_CA_CERTS: ''
      NODE_OPTIONS: ''
      NODE_PATH: ''
  - id: markitdown
    name: Markitdown
    tier: role
    profiles:
      - biz-ops
      - rnd-researcher
    what: Turns PDF, Word, Excel, PowerPoint and HTML into Markdown (1 tool)
    transport: stdio
    runner: uvx
    args:
      - markitdown-mcp==0.0.1a7
  - id: linear
    name: Linear
    tier: core
    profiles:
      - build-code
      - rnd-researcher
      - biz-ops
      - plan-triage
    what: Tickets and projects — read-only endpoint by default
    transport: http
    url: https://mcp.linear.app/mcp/readonly
    auth:
      type: oauth
  - id: notion
    name: Notion
    tier: role
    profiles:
      - plan-triage
    clients_only:
      - front-studio
      - claude-code
    what: Look up and lightly edit Notion until the move to Obsidian is done
    transport: http
    url: https://mcp.notion.com/mcp
    auth:
      type: oauth
  - id: sentry
    name: Sentry
    tier: role
    profiles:
      - build-code
      - plan-triage
    what: Errors and traces for apps that report to Sentry (inspect + seer skills only)
    transport: http
    url: https://mcp.sentry.dev/mcp/your-account/your-account
    auth:
      type: oauth
  - id: dbhub
    name: DBHub (spend ledger)
    tier: role
    profiles:
      - plan-triage
      - biz-ops
    what: One read-only database tool for the LiteLLM spend ledger (and any local SQLite file later)
    transport: stdio
    runner: npx
    package: '@bytebase/dbhub@1.2.5'
    args:
      - --transport
      - stdio
      - --config
      - ~/.config/praxen-toolbox/dbhub.toml
    secrets_env:
      - PRAXEN_SPEND_RO_DSN
  - id: filesystem
    name: Filesystem
    tier: role
    profiles:
      - biz-ops
      - build-code
    clients_only:
      - front-studio
      - front-go
    what: File access for chat apps that have no file tools of their own
    transport: stdio
    runner: npx
    package: '@modelcontextprotocol/server-filesystem@2026.8.31'
    args:
      - ~/Desktop/github-projects
  - id: windows-mcp
    name: Windows-MCP
    tier: role
    profiles:
      - desktop
    clients_only:
      - front-studio
      - coder
      - codex
    what: Drive Windows apps that have no API, supervised, in desktop chat app
    transport: stdio
    runner: uvx
    args:
      - windows-mcp==0.8.5
      - serve
      - --exclude-tools
      - PowerShell,Registry,FileSystem,Process
    env:
      ANONYMIZED_TELEMETRY: 'false'
  - id: front-go
    name: task app (control plane)
    tier: role
    profiles:
      - plan-triage
    clients_only:
      - front-studio
    what: Drive task app from a desktop chat - create/stop agents, enqueue prompts, read conversations, answer approvals, connect channels (29 tools on the task app0.16.0)
    transport: http
    url: http://127.0.0.1:6274/mcp
    auth:
      type: header
      header: Authorization
      secret: GO_MCP_TOKEN
  - id: gitlab
    name: GitLab
    tier: role
    profiles:
      - build-code
      - plan-triage
    what: Projects, issues and merge requests on gitlab.com through GitLab's own MCP server (beta, all tiers)
    transport: http
    url: https://gitlab.com/api/v4/mcp
    auth:
      type: oauth
    headers:
      X-Gitlab-Mcp-Server-Tool-Name-Prefix: gitlab_
  - id: pdf-tools
    name: PDF Tools
    tier: role
    profiles:
      - biz-ops
    clients_only:
      - claude-code
      - front-studio
      - coder
    enabled_for:
      - claude-code
      - front-studio
    what: Create PDFs from Markdown, fill forms, merge, split, encrypt (the operator's Front entry, kept by ruling 2026-09-16)
    transport: stdio
    runner: npx
    package: '@aryanbv/pdf-toolkit-mcp@0.3.1'
  - id: desktop-commander
    name: Desktop Commander
    tier: role
    profiles:
      - build-code
      - biz-ops
    clients_only:
      - claude-code
      - coder
      - codex
    enabled_for:
      - claude-code
    what: Terminal, process and file control from a chat client that has no shell of its own
    transport: stdio
    runner: npx
    package: '@wonderwhy-er/desktop-commander@0.2.50'
    args:
      - --no-onboarding
  - id: graphify
    name: graphify (code knowledge graph)
    tier: role
    profiles:
      - build-code
    clients_only:
      - claude-code
      - codex
      - coder
    what: Query a per-repo knowledge graph (tree-sitter AST, no vector store; 10 tools incl. PR impact) instead of grepping; can also emit an Obsidian vault
    transport: stdio
    runner: path
    command_runtime: graphify_mcp
    args:
      - graphify-out/graph.json
  - id: memory
    name: Memory (knowledge graph)
    tier: role
    profiles:
      - build-code
      - rnd-researcher
    clients_only:
      - coder
      - codex
      - claude-code
    default_enabled: false
    what: Persistent entity/relation memory for chats driven by smaller models (the operator ruling 2026-09-17)
    transport: stdio
    runner: npx
    package: '@modelcontextprotocol/server-memory@2026.8.31'
  - id: sequential-thinking
    name: Sequential Thinking
    tier: role
    profiles:
      - build-code
      - rnd-researcher
    clients_only:
      - coder
      - codex
      - claude-code
    default_enabled: false
    what: Step-by-step scratchpad tool for models that do not plan well on their own (the operator ruling 2026-09-17)
    transport: stdio
    runner: npx
    package: '@modelcontextprotocol/server-sequential-thinking@2026.8.31'
  - id: figma
    name: Figma
    tier: role
    profiles:
      - build-code
    clients_only:
      - coder
    default_enabled: false
    what: Read designs and generate code from Figma files (Figma's remote server, OAuth)
    transport: http
    url: https://mcp.figma.com/mcp
    auth:
      type: oauth
  - id: neon
    name: Neon
    tier: role
    profiles:
      - build-code
      - plan-triage
    clients_only:
      - coder
    default_enabled: false
    what: Neon Postgres projects, branches and SQL through Neon's remote MCP (OAuth)
    transport: http
    url: https://mcp.neon.tech/mcp
    auth:
      type: oauth
  - id: ruflo-core
    name: ruflo (orchestration)
    tier: role
    profiles:
      - build-code
    clients_only:
      - coder
    default_enabled: false
    what: Agent-swarm orchestration MCP (358 tools on 3.55.0); off by default, 16 read-only tools allowed, 17 agent/task tools ask, the rest denied and hidden
    transport: stdio
    runner: path
    command_runtime: node
    args:
      - C:\Praxen\Tools\ruflo\3.55.0-r1\launch-ruflo-mcp.mjs
  - id: ruvector-memory
    name: RuVector (read-only semantic memory)
    tier: role
    profiles:
      - build-code
    clients_only:
      - coder
    default_enabled: false
    what: Semantic-memory and routing hooks in the read-only profile (15 tools - hooks_stats, hooks_route, hooks_recall, hooks_doctor, hooks_capabilities, hooks_suggest_context, metaharness_status, metaharness_route and friends)
    transport: stdio
    runner: path
    command_runtime: node
    args:
      - C:\Praxen\Tools\ruvector\0.3.3-r1\launch-guard.mjs
      - --contract
      - praxen-managed-tool-node-launch-guard-v1
      - --root
      - C:\Praxen\Tools\ruvector\0.3.3-r1
      - --receipt
      - C:\Praxen\Tools\ruvector\0.3.3-r1\install-receipt.json
      - --receipt-sha256
      - 366d18ac497a70aec65ddd0df4b1847dc70bba174261e4f612c10ce02a7bd456
      - --target
      - C:\Praxen\Tools\ruvector\0.3.3-r1\launch-ruvector-mcp.mjs
      - --
  - id: ruview-operator
    name: RuView (domain operator)
    tier: role
    profiles:
      - build-code
    clients_only:
      - coder
    setup: Same release; every network, OAuth, device and mutation tool starts at ask/deny per captured tool evidence (plan Task 5).
    what: Domain operator MCP and native skill pack
    transport: stdio
    runner: npx
    package: '@ruvnet/ruview@0.5.1'
    args:
      - mcp
      - start
  - id: rvm-docs
    name: RVM docs (read-only)
    tier: role
    profiles:
      - build-code
    clients_only:
      - coder
    setup: Build from the RVM repo at commit 0973d77e5a9e99065376e8ef772a4a1d16e88c75 (userguide/mcp, npm ci --ignore-scripts, npm run build) into C:\Praxen\Tools\rvm; expected six docs_* tools (plan Task 5).
    what: Read-only documentation MCP for RVM (docs_search, docs_navigate, docs_xref, docs_glossary, docs_api, docs_howto)
    transport: stdio
    runner: path
    command_runtime: rvm_docs
    args:
      - serve
  - id: tavily
    name: Tavily
    tier: role
    profiles:
      - rnd-researcher
    what: Search, extract, map and crawl (third call after SearXNG and Exa; second crawler after Firecrawl)
    transport: http
    url: https://mcp.tavily.com/mcp/
    auth:
      type: bearer
      secret: TAVILY_API_KEY
    default_enabled: false
    enabled_for:
      - coder
  - id: obsidian
    name: Obsidian vault (mcpvault)
    tier: role
    profiles:
      - biz-ops
      - plan-triage
    what: Read notes in praxen-vault from chat apps without the Obsidian CLI (read-only; BM25 search, frontmatter, stats)
    transport: stdio
    runner: npx
    package: '@bitbonsai/mcpvault@0.15.0'
    args:
      - ~/praxen-vault
      - --read-only
  - id: mempalace
    name: MemPalace
    tier: role
    profiles:
      - build-code
      - rnd-researcher
      - biz-ops
      - plan-triage
    clients_only:
      - claude-code
      - claude-code-wsl
    what: Search the shared memory palace; full server for Claude
    transport: stdio
    runner: path
    command_runtime: mempalace_full
  - id: mempalace
    name: MemPalace (light)
    tier: role
    profiles:
      - build-code
      - rnd-researcher
      - biz-ops
      - plan-triage
    clients_only:
      - coder
      - vscode
      - codex
      - front-studio
      - front-go
      - paperclip
      - codex-wsl
      - grok
    what: Search the shared memory palace with the compact MCP server
    transport: stdio
    runner: path
    command_runtime: mempalace_light
dropped:
  - name: Brave Search
    instead: SearXNG, then Exa
  - name: Kagi
    instead: SearXNG, then Exa; Jina read_url with a question for long pages
  - name: SearXNG (second copy from GitHub)
    instead: SearXNG
  - name: Google Search
    instead: SearXNG
  - name: Fetch Content
    instead: Jina read; SearXNG's reader as the free fallback
  - name: Git
    instead: App terminals + GitHub
  - name: Playwright
    instead: Chrome DevTools elsewhere; the guarded Playwright in Coder
  - name: macOS Info
    instead: Nothing needed
  - name: Google Maps
    instead: Google's Grounding Lite only for a maps job
  - name: SQLite
    instead: DBHub
  - name: MySQL
    instead: DBHub if one appears
  - name: SQL Server
    instead: DBHub if one appears
  - name: PostgreSQL
    instead: DBHub
  - name: Redis
    instead: redis-cli from a shell when debugging
  - name: ChromaDB
    instead: Front Knowledge Stacks
  - name: Google Drive
    instead: Nothing needed
  - name: Supabase
    instead: Nothing needed
  - name: Qdrant
    instead: Nothing needed
  - name: Docker MCP gateway
    instead: This list rendered into each app's own config
