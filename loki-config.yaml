# =============================================================================
# Grafana Loki configuration (single-node monolithic, filesystem storage)
#
# Storage under /loki on a NAMED volume - the image runs as UID 10001, so a bind
# mount would need a chown first. tsdb index, schema v13, 168h (7d) retention
# enforced by the compactor: delete_request_store is REQUIRED whenever
# retention_enabled is true. schema_config.from must predate the first ingested
# line and must NEVER change once data exists. Promtail is EOL - logs arrive
# from Grafana Alloy (alloy-config.alloy). Usage reporting (phone-home) is off.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
